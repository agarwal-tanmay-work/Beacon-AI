[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
    "ignore:.*crypt.*:DeprecationWarning",
]

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["uploads", ".local_storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S110", "S113"]
ignore = [
    "E501",  # long prompt strings are fine
    "B008",  # FastAPI's Depends()/File() defaults are idiomatic
    "ASYNC109",  # `timeout` parameters are forwarded to httpx, not implemented with asyncio.timeout
    "UP042",  # keep (str, Enum): the database enum types were created from these classes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "S"]
