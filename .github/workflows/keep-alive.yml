name: Keep Render Alive

on:
  schedule:
    # Runs every 5 minutes — well under Render's 15-min spin-down threshold
    - cron: "*/5 * * * *"
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: |
          echo "Pinging Render backend..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 "${{ secrets.RENDER_BACKEND_URL }}/health")
          echo "Response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "Backend is alive."
          else
            echo "Backend returned $STATUS — may be cold-starting, that is OK."
          fi
