name: Keep Render Alive

# Render's free plan sleeps a service after 15 idle minutes (a cold start takes 30-60 s). This pings /health.
# Requires the repository secret RENDER_BACKEND_URL (e.g. https://beacon-backend.onrender.com, no trailing slash).
on:
  schedule:
    - cron: "*/5 * * * *"  # well under Render's 15-minute spin-down threshold (GitHub may delay scheduled runs)
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping backend health endpoint
        env:
          URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$URL" ]; then echo "RENDER_BACKEND_URL secret is not set - nothing to ping."; exit 0; fi
          body=$(curl -sS --max-time 90 --retry 2 --retry-delay 5 -w '\n%{http_code}' "$URL/health" || true)
          echo "$body" | tail -n 2
          # A cold start can legitimately take a while; this job only needs to wake the service, not gate anything.
